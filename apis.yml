aid: terremoto-biosciences
name: Terremoto Biosciences
description: >-
  Terremoto Biosciences is a privately held, clinical-stage biotechnology company based in South San
  Francisco, California, building a covalent drug discovery and development engine around lysine-based
  covalency. Founded in 2022 by veterans of Principia Biopharma and backed by OrbiMed and Third Rock
  Ventures across Series A ($75M), Series B ($175M) and Series C ($108M) financings, the company designs
  highly selective small-molecule medicines aimed both at improving on known drug targets and at reaching
  targets previously considered undruggable. Its lead program, TER-2013, is an AKT1-selective inhibitor
  granted FDA Fast Track designation for breast cancer, with additional work in oncology and hereditary
  hemorrhagic telangiectasia. Terremoto is a therapeutics developer, not a software vendor: it publishes
  no public API, developer portal, SDK or machine-readable API contract, and its public web surface is a
  corporate marketing site covering science, pipeline, news and careers.
